{% extends 'cinema/base.html' %}
{% block content %}
<h2 class="mb-4">Bar del Cine - Palomitas y más</h2>
<div class="card bg-black border-secondary">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input class="form-control" name="customer_name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="customer_email" required>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-dark table-striped">
          <thead>
            <tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Cantidad</th></tr>
          </thead>
          <tbody>
            {% for snack in snacks %}
              <tr>
                <td>{{ snack.name }}</td>
                <td>${{ snack.price }}</td>
                <td>{{ snack.stock }}</td>
                <td>
                  <input class="form-control" style="max-width: 100px" type="number" min="0" max="{{ snack.stock }}" name="snack_{{ snack.id }}" value="0">
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      <button class="btn btn-warning">Confirmar pedido</button>
    </form>
  </div>
</div>
{% endblock %}
